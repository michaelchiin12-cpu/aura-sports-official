<!DOCTYPE html>
<html lang="id" style="background:#000;">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AURA SPORT MANAGER</title>
  <link rel="icon" type="image/png" href="logo-favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Oswald:wght@500;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-main: #000000;
      --bg-card: #111111;
      --primary: #c89f4c;
      --primary-hover: #e0b865;
      --success: #10b981;
      --danger: #ef4444;
      --warning: #f59e0b;
      --text-main: #ffffff;
      --text-muted: #9ca3af;
      --border: #333333;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body {
      background: var(--bg-main);
      color: var(--text-main);
      padding: 20px;
    }

    .header {
      text-align: center;
      margin-bottom: 20px;
      padding-bottom: 10px;
      border-bottom: 2px solid var(--border);
    }

    .header img { width: 120px; height: auto; margin-bottom: 10px; }
    .header h1 { color: var(--primary); }

    .nav-tabs {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .tab-btn {
      padding: 12px 22px;
      border-radius: 8px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text-muted);
      cursor: pointer;
      font-weight: 700;
    }

    .tab-btn.active {
      background: var(--primary);
      color: #000;
      border-color: var(--primary);
    }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    .container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 20px;
      margin-bottom: 20px;
    }

    h2 {
      color: var(--primary);
      margin-bottom: 15px;
      font-size: 1.2rem;
    }

    input, select, button {
      padding: 9px 12px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--bg-main);
      color: var(--text-main);
      margin: 5px 0;
    }

    button {
      background: var(--primary);
      color: #000;
      border: none;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover { background: var(--primary-hover); }
    button.btn-danger { background: var(--danger); color: #fff; }
    button.btn-success { background: var(--success); color: #fff; }
    button.btn-warning { background: var(--warning); color: #000; }

    .flex-row {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }

    .member-form-grid {
      display: grid;
      grid-template-columns: 1.2fr 0.7fr 0.7fr 1fr 0.7fr;
      gap: 10px;
      align-items: end;
    }

    .full-width { width: 100%; }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }

    th, td {
      padding: 10px;
      border-bottom: 1px solid var(--border);
      text-align: left;
      vertical-align: middle;
    }

    th {
      background: var(--bg-main);
      color: var(--primary);
    }

    .avatar-img, .avatar-placeholder {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--primary);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: #2a2a2a;
      color: var(--text-muted);
      font-weight: bold;
    }

    .avatar-cell {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .member-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 15px;
    }

    .member-card {
      background: var(--bg-main);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 15px;
    }

    .member-card-top {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }

    .member-card .photo {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--primary);
      background: #2a2a2a;
    }

    .member-name {
      font-size: 1.05rem;
      font-weight: bold;
      color: var(--text-main);
    }

    .member-meta {
      color: var(--text-muted);
      font-size: 0.82rem;
      margin-top: 3px;
    }

    .member-stats {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-top: 12px;
    }

    .member-stat {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 10px;
    }

    .member-stat-label {
      color: var(--text-muted);
      font-size: 0.7rem;
      display: block;
      margin-bottom: 4px;
    }

    .member-stat-value {
      color: var(--primary);
      font-weight: bold;
      font-size: 1rem;
    }

    .member-actions {
      display: flex;
      gap: 8px;
      margin-top: 12px;
      flex-wrap: wrap;
    }

    .filter-row {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
      flex-wrap: wrap;
    }

    .summary-box {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
      margin-bottom: 20px;
    }

    .summary-card {
      background: var(--bg-main);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
    }

    .summary-card .label {
      color: var(--text-muted);
      font-size: 0.8rem;
    }

    .summary-card .value {
      color: var(--primary);
      font-size: 1.35rem;
      font-weight: bold;
      margin-top: 6px;
    }

    @media (max-width: 900px) {
      .container { grid-template-columns: 1fr; }
      .member-form-grid { grid-template-columns: 1fr 1fr; }
    }

    @media (max-width: 600px) {
      body { padding: 10px; }
      .member-form-grid { grid-template-columns: 1fr; }
      .nav-tabs { gap: 6px; }
      .tab-btn { flex: 1 1 46%; padding: 10px 6px; }
      .header img { width: 90px; }
      .header h1 { font-size: 1.4rem; }
    }
  </style>
</head>
<body>
  <div class="header">
    <img src="logo.png" alt="Logo Aura" />
    <h1>AURA SPORT MANAGER</h1>
  </div>

  <div class="nav-tabs">
    <button class="tab-btn active" onclick="switchTab(event, 'match')">🔁 Round Mix</button>
    <button class="tab-btn" onclick="switchTab(event, 'finance')">💰 Kas Aura</button>
    <button class="tab-btn" onclick="switchTab(event, 'members')">👤 Data Member</button>
  </div>

  <div id="tab-match" class="tab-content active">
    <div class="container">
      <div>
        <div class="card">
          <h2>Registrasi Pemain</h2>
          <form id="playerForm" onsubmit="addPlayer(event)">
            <div class="member-form-grid">
              <div>
                <input id="playerName" type="text" class="full-width" placeholder="Nama Pemain" required />
              </div>
              <div>
                <input id="playerBirthDate" type="date" class="full-width" />
              </div>
              <div>
                <select id="playerGender" class="full-width" required>
                  <option value="L">L</option>
                  <option value="P">P</option>
                </select>
              </div>
              <div>
                <select id="playerLevel" class="full-width" required>
                  <option value="3">Advanced</option>
                  <option value="2">Intermediate</option>
                  <option value="1">Beginner</option>
                </select>
              </div>
              <div>
                <input id="playerPhoto" type="file" accept="image/*" class="full-width" />
              </div>
            </div>
            <button type="submit" class="btn-success" style="width:100%; margin-top:10px;">+ Tambah Member</button>
          </form>
        </div>
      </div>

      <div>
        <div class="card">
          <h2>Daftar Member</h2>
          <div style="overflow-x: auto;">
            <table>
              <thead>
                <tr>
                  <th>Foto</th>
                  <th>Nama</th>
                  <th>TTL</th>
                  <th>Level</th>
                  <th>Bermain</th>
                  <th>Aksi</th>
                </tr>
              </thead>
              <tbody id="playersList"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="tab-finance" class="tab-content">
    <div class="container">
      <div class="card" style="width:100%;">
        <h2>Komunitas Kas Aura</h2>
        <div class="summary-box">
          <div class="summary-card">
            <div class="label">Total Member</div>
            <div class="value" id="summaryMembers">0</div>
          </div>
          <div class="summary-card">
            <div class="label">Total Bermain</div>
            <div class="value" id="summaryTotalGames">0</div>
          </div>
          <div class="summary-card">
            <div class="label">Saldo Tersedia</div>
            <div class="value" id="summaryBalance">Rp 0</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="tab-members" class="tab-content">
    <div class="container">
      <div class="card" style="width:100%;">
        <h2>Data Member</h2>
        <div class="filter-row">
          <input id="memberSearch" type="text" placeholder="Cari nama member..." style="flex:1; min-width: 180px;" />
          <select id="memberLevelFilter" style="min-width: 180px;">
            <option value="ALL">Semua Level</option>
            <option value="1">Beginner</option>
            <option value="2">Intermediate</option>
            <option value="3">Advanced</option>
          </select>
        </div>
        <div id="memberGrid" class="member-grid"></div>
      </div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'aura_member_data_v1';

    let players = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
    if (!players.length) {
      players = [
        { id: crypto.randomUUID ? crypto.randomUUID() : 'm-' + Date.now(), name: 'Rafi', gender: 'L', level: 3, birthDate: '2001-05-14', photo: '', stats: { played: 16 }, deposit: 250000 },
        { id: crypto.randomUUID ? crypto.randomUUID() : 'm-' + Date.now(), name: 'Della', gender: 'P', level: 2, birthDate: '2003-08-02', photo: '', stats: { played: 11 }, deposit: 180000 },
        { id: crypto.randomUUID ? crypto.randomUUID() : 'm-' + Date.now(), name: 'Tono', gender: 'L', level: 1, birthDate: '1999-12-13', photo: '', stats: { played: 7 }, deposit: 120000 }
      ];
      savePlayers();
    }

    function savePlayers() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(players));
    }

    function switchTab(event, tabName) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
      event.currentTarget.classList.add('active');
      document.getElementById('tab-' + tabName).classList.add('active');
    }

    function formatLevel(level) {
      if (level === 3) return 'Advanced';
      if (level === 2) return 'Intermediate';
      return 'Beginner';
    }

    function formatDate(value) {
      if (!value) return '-';
      const d = new Date(value + 'T00:00:00');
      if (Number.isNaN(d.getTime())) return value;
      return d.toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' });
    }

    function money(value) {
      return 'Rp ' + Number(value || 0).toLocaleString('id-ID');
    }

    function getPhotoElement(photo, fallbackName) {
      if (photo) {
        return '<img class="avatar-img" src="' + photo + '" alt="' + fallbackName + '" />';
      }
      const initials = fallbackName.split(' ').map(p => p[0]).slice(0, 2).join('').toUpperCase();
      return '<div class="avatar-placeholder">' + initials + '</div>';
    }

    function renderPlayers() {
      const tbody = document.getElementById('playersList');
      if (!tbody) return;

      tbody.innerHTML = players.map(player => `
        <tr>
          <td>${getPhotoElement(player.photo, player.name)}</td>
          <td>${player.name}</td>
          <td>${formatDate(player.birthDate)}</td>
          <td>${formatLevel(Number(player.level || 1))}</td>
          <td>${player.stats?.played ?? 0}</td>
          <td>
            <button type="button" class="btn-warning" onclick="editPlayer('${player.id}')">Edit</button>
            <button type="button" class="btn-danger" onclick="deletePlayer('${player.id}')">Hapus</button>
          </td>
        </tr>
      `).join('');
    }

    function renderFinanceSummary() {
      const totalMembers = players.length;
      const totalGames = players.reduce((sum, p) => sum + (Number(p.stats?.played || 0)), 0);
      const totalBalance = players.reduce((sum, p) => sum + (Number(p.deposit || 0)), 0);

      const summaryMembers = document.getElementById('summaryMembers');
      const summaryTotalGames = document.getElementById('summaryTotalGames');
      const summaryBalance = document.getElementById('summaryBalance');

      if (summaryMembers) summaryMembers.textContent = totalMembers;
      if (summaryTotalGames) summaryTotalGames.textContent = totalGames;
      if (summaryBalance) summaryBalance.textContent = money(totalBalance);
    }

    function renderMemberData() {
      const grid = document.getElementById('memberGrid');
      if (!grid) return;

      const search = (document.getElementById('memberSearch') || {}).value || '';
      const filterLevel = (document.getElementById('memberLevelFilter') || {}).value || 'ALL';

      const filtered = players.filter(player => {
        const matchesName = player.name.toLowerCase().includes(search.toLowerCase());
        const matchesLevel = filterLevel === 'ALL' ? true : String(player.level || 1) === String(filterLevel);
        return matchesName && matchesLevel;
      });

      if (!filtered.length) {
        grid.innerHTML = '<div class="card" style="width:100%;">Tidak ada member yang cocok dengan filter.</div>';
        return;
      }

      grid.innerHTML = filtered.map(player => `
        <div class="member-card">
          <div class="member-card-top">
            ${getPhotoElement(player.photo, player.name)}
            <div>
              <div class="member-name">${player.name}</div>
              <div class="member-meta">${formatLevel(Number(player.level || 1))}</div>
            </div>
          </div>

          <div class="member-meta">📅 Tanggal lahir: ${formatDate(player.birthDate)}</div>
          <div class="member-meta">⚧ Gender: ${player.gender || 'L'}</div>

          <div class="member-stats">
            <div class="member-stat">
              <span class="member-stat-label">Bermain</span>
              <span class="member-stat-value">${player.stats?.played ?? 0}</span>
            </div>
            <div class="member-stat">
              <span class="member-stat-label">Deposit</span>
              <span class="member-stat-value">${money(player.deposit)}</span>
            </div>
          </div>

          <div class="member-actions">
            <button type="button" onclick="editPlayer('${player.id}')">Edit</button>
            <button type="button" class="btn-danger" onclick="deletePlayer('${player.id}')">Hapus</button>
          </div>
        </div>
      `).join('');
    }

    function addPlayer(event) {
      event.preventDefault();

      const nameInput = document.getElementById('playerName');
      const birthDateInput = document.getElementById('playerBirthDate');
      const genderInput = document.getElementById('playerGender');
      const levelInput = document.getElementById('playerLevel');
      const photoInput = document.getElementById('playerPhoto');

      const name = nameInput.value.trim();
      if (!name) {
        alert('Nama member wajib diisi.');
        return;
      }

      const newPlayer = {
        id: crypto.randomUUID ? crypto.randomUUID() : 'player-' + Date.now(),
        name,
        gender: genderInput.value,
        level: Number(levelInput.value || 1),
        birthDate: birthDateInput.value,
        photo: '',
        deposit: 0,
        stats: { played: 0 },
        ready: true,
        createdAt: new Date().toISOString()
      };

      if (photoInput && photoInput.files && photoInput.files[0]) {
        const file = photoInput.files[0];
        const reader = new FileReader();
        reader.onload = () => {
          newPlayer.photo = reader.result;
          players.unshift(newPlayer);
          savePlayers();
          renderAll();
          playerForm.reset();
        };
        reader.readAsDataURL(file);
        return;
      }

      players.unshift(newPlayer);
      savePlayers();
      renderAll();
      event.target.reset();
    }

    function editPlayer(playerId) {
      const player = players.find(item => item.id === playerId);
      if (!player) return;

      const newName = prompt('Edit Nama Member', player.name);
      if (newName === null) return;

      const newBirthDate = prompt('Edit Tanggal Lahir (YYYY-MM-DD)', player.birthDate || '');
      if (newBirthDate === null) return;

      const newLevel = prompt('Edit Level (1=Beginner, 2=Intermediate, 3=Advanced)', String(player.level || 1));
      if (newLevel === null) return;

      player.name = newName.trim() || player.name;
      player.birthDate = newBirthDate.trim();
      player.level = Number(newLevel) || player.level;

      if (player.stats) {
        player.stats.played = Number(player.stats.played || 0);
      }

      savePlayers();
      renderAll();
    }

    function deletePlayer(playerId) {
      if (!confirm('Hapus member ini?')) return;
      players = players.filter(item => item.id !== playerId);
      savePlayers();
      renderAll();
    }

    function renderAll() {
      renderPlayers();
      renderFinanceSummary();
      renderMemberData();
    }

    document.getElementById('memberSearch')?.addEventListener('input', renderMemberData);
    document.getElementById('memberLevelFilter')?.addEventListener('change', renderMemberData);

    renderAll();
  </script>
</body>
</html>
