name: Telegram Agent Checks

on:
  pull_request:
    paths:
      - "telegram-agent/**"
      - ".github/workflows/telegram-agent-check.yml"
  push:
    branches:
      - main
    paths:
      - "telegram-agent/**"
      - ".github/workflows/telegram-agent-check.yml"

permissions:
  contents: read

jobs:
  typecheck:
    name: TypeScript typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: telegram-agent
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: telegram-agent/package-lock.json
      - name: Install dependencies
        run: npm install --package-lock-only && npm ci
      - name: Typecheck
        run: npm run typecheck
